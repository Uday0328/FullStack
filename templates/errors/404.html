<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Uday Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #08080f;
      color: #e8e8f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      background: linear-gradient(135deg, #00d4aa, #00a87d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; }
    p { color: #8888aa; margin-bottom: 32px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: #00d4aa;
      color: #08080f;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #00a87d; }
  </style>
</head>
<body>
  <div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>Looks like this page doesn't exist. Maybe it was moved or never existed.</p>
    <a href="/">← Back to Portfolio</a>
  </div>
</body>
</html>
