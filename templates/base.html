<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}Byreddy Uday Pujith Reddy — AI & Data Science Student, aspiring Full-Stack Developer. Portfolio showcasing projects in Machine Learning, NLP, and Web Development.{% endblock %}" />
  <meta name="keywords" content="Byreddy Uday Pujith Reddy, AI, Data Science, Machine Learning, Full-Stack Developer, Portfolio" />
  <meta name="author" content="Byreddy Uday Pujith Reddy" />
  <meta property="og:title" content="{% block og_title %}Uday Pujith Reddy — Portfolio{% endblock %}" />
  <meta property="og:description" content="AI & Data Science undergraduate | Full-Stack Developer Portfolio" />
  <meta property="og:type" content="website" />
  <title>{% block title %}Uday Pujith Reddy | AI & Data Science Portfolio{% endblock %}</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  {% block extra_css %}{% endblock %}
  <!-- Critical inline styles to guarantee correct fonts/colors regardless of CDN caching -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');
    :root {
      --bg: #110d06 !important;
      --bg-2: #1e160a !important;
      --surface: #1e160a !important;
      --surface-2: #2a1e0e !important;
      --surface-3: #3e2e17 !important;
      --accent: #d4943a !important;
      --accent-dim: #7a5c30 !important;
      --accent-glow: rgba(212,148,58,0.15) !important;
      --accent-glow-2: rgba(212,148,58,0.06) !important;
      --text-primary: #fdf8f0 !important;
      --text-secondary: #c4b896 !important;
      --text-muted: #7a5c30 !important;
      --border: rgba(212,148,58,0.16) !important;
      --border-hover: rgba(212,148,58,0.45) !important;
      --font-display: 'Cormorant Garamond', Georgia, serif !important;
      --font-sans: 'DM Sans', sans-serif !important;
      --error: #c04a1a !important;
      --success: #d4943a !important;
      --warning: #f0b84a !important;
    }
    body {
      font-family: 'DM Sans', sans-serif !important;
      background-color: #110d06 !important;
      color: #fdf8f0 !important;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cormorant Garamond', Georgia, serif !important;
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
